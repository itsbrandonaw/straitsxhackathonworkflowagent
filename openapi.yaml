openapi: 3.1.0
info:
  title: Happy Scouts API
  version: 0.1.0
servers:
  - url: http://localhost:3001
paths:
  /v1/runs/search:
    post:
      summary: Start website-integrated Scout discovery
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WebsiteSearchRequest" }
      responses: { "202": { description: Run accepted for background execution } }
  /v1/runs/{activityId}/pause:
    post:
      summary: Pause website-integrated Scout discovery
      parameters: [{ $ref: "#/components/parameters/ActivityId" }]
      responses: { "202": { description: Pause accepted } }
  /v1/runs/{activityId}/resume:
    post:
      summary: Resume website-integrated Scout discovery
      parameters: [{ $ref: "#/components/parameters/ActivityId" }]
      responses: { "202": { description: Resume accepted } }
  /v1/runs/{activityId}/cancel:
    post:
      summary: Cancel website-integrated Scout discovery
      parameters: [{ $ref: "#/components/parameters/ActivityId" }]
      responses: { "202": { description: Cancellation accepted } }
  /v1/runs/{activityId}/reject:
    post:
      summary: Reject one selected listing
      parameters: [{ $ref: "#/components/parameters/ActivityId" }]
      responses: { "202": { description: Rejection accepted } }
  /v1/live-view/connection:
    post:
      summary: Exchange an opaque viewer capability for a fresh signed AgentCore connection
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [capability]
              properties: { capability: { type: string, minLength: 32 } }
      responses:
        "200": { description: Short-lived signed connection }
        "410": { description: Capability expired or Scout session ended }
  /v1/scout-runs:
    post:
      summary: Start an idempotent Scout Activity
      parameters:
        - in: header
          name: idempotency-key
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/StartScoutRunRequest" }
      responses:
        "202": { description: Activity accepted }
  /v1/scout-runs/{activityId}:
    get:
      summary: Read the current Activity state
      parameters:
        - $ref: "#/components/parameters/ActivityId"
      responses:
        "200": { description: Activity state }
  /v1/scout-runs/{activityId}/pause:
    post:
      summary: Pause active Scout work
      parameters: [{ $ref: "#/components/parameters/ActivityId" }]
      responses: { "200": { description: Paused Activity } }
  /v1/scout-runs/{activityId}/resume:
    post:
      summary: Resume paused Scout work
      parameters: [{ $ref: "#/components/parameters/ActivityId" }]
      responses: { "200": { description: Resumed Activity } }
  /v1/scout-runs/{activityId}/cancel:
    post:
      summary: Cancel incomplete Scout work
      parameters: [{ $ref: "#/components/parameters/ActivityId" }]
      responses: { "200": { description: Cancelled Activity } }
  /v1/scout-runs/{activityId}/confirm:
    post:
      summary: Confirm selected items
      parameters: [{ $ref: "#/components/parameters/ActivityId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [itemIds]
              properties:
                itemIds: { type: array, minItems: 1, items: { type: string } }
      responses: { "200": { description: Updated Activity } }
  /v1/scout-runs/{activityId}/closer-handoff:
    get:
      summary: Return confirmed item URLs for Closer
      parameters: [{ $ref: "#/components/parameters/ActivityId" }]
      responses:
        "200":
          description: Closer handoff
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CloserHandoff" }
  /v1/scout-runs/{activityId}/items/{itemId}/reject:
    post:
      summary: Reject the current item selection and use a retained alternative
      parameters:
        - $ref: "#/components/parameters/ActivityId"
        - in: path
          name: itemId
          required: true
          schema: { type: string }
      responses: { "200": { description: Updated selection } }
  /v1/scouts/{scoutId}/snapshot:
    get:
      summary: Return or redirect to the Scout's latest snapshot
      parameters:
        - in: path
          name: scoutId
          required: true
          schema: { type: string }
      responses: { "200": { description: Image }, "302": { description: Presigned S3 image } }
components:
  parameters:
    ActivityId:
      in: path
      name: activityId
      required: true
      schema: { type: string }
  schemas:
    WebsiteSearchRequest:
      type: object
      required: [activityId, items, callback, scouts]
      properties:
        activityId: { type: string }
        items:
          type: array
          minItems: 1
          maxItems: 10
          items:
            type: object
            required: [id, name, short, spec, budget, hueIndex]
            properties:
              id: { type: string }
              name: { type: string }
              short: { type: string }
              spec: { type: string }
              budget: { type: string }
              hueIndex: { type: integer, minimum: 0, maximum: 5 }
              category: { type: string }
        clarifications: { type: array, items: { type: object } }
        callback:
          type: object
          required: [url]
          properties:
            url: { type: string, format: uri }
            token: { type: string }
        scouts:
          type: object
          required: [perItem, maxConcurrentItems, listingsPerScout, strategies]
          properties:
            perItem: { const: 2 }
            maxConcurrentItems: { type: integer, maximum: 5 }
            listingsPerScout: { type: integer, minimum: 1, maximum: 3 }
            strategies:
              type: array
              prefixItems:
                - { const: large-marketplaces }
                - { const: specialist-independent }
              minItems: 2
              maxItems: 2
    StartScoutRunRequest:
      type: object
      required: [activityId, items]
      properties:
        activityId: { type: string }
        items:
          type: array
          minItems: 1
          items:
            type: object
            required: [itemId, name, specs]
            properties:
              itemId: { type: string }
              name: { type: string }
              specs: { type: object, additionalProperties: { type: string } }
              quantity: { type: integer, minimum: 1, default: 1 }
              priceCapSGD: { type: number, exclusiveMinimum: 0 }
              rankingPreset:
                type: string
                enum: [best_overall, lowest_price, trusted_seller, best_reviewed]
                default: best_overall
              shipToCountry: { type: string, default: SG }
              locale: { type: string, default: en-SG }
    CloserHandoff:
      type: object
      required: [activityId, selections]
      properties:
        activityId: { type: string }
        selections:
          type: array
          items:
            type: object
            required: [itemId, url]
            properties:
              itemId: { type: string }
              url: { type: string, format: uri }
